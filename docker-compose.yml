services:
  cv:
    image: classical-cv-tracking:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${UID_GID:-1000:1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - HOME=/tmp
    command: ["tail", "-f", "/dev/null"]

  gt:
    image: classical-cv-tracking-gt:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.gt
    profiles: ["gt"]
    runtime: nvidia
    user: "${UID_GID:-1000:1000}"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - HOME=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: ["tail", "-f", "/dev/null"]
